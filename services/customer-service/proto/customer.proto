syntax = "proto3";

package customer;

// Customer Service - gRPC interface
service CustomerService {
  // Create a new customer
  rpc CreateCustomer (CreateCustomerRequest) returns (CustomerResponse);
  // Get a customer by ID
  rpc GetCustomer (GetCustomerRequest) returns (CustomerResponse);
  // Update an existing customer
  rpc UpdateCustomer (UpdateCustomerRequest) returns (CustomerResponse);
  // Delete a customer by ID
  rpc DeleteCustomer (DeleteCustomerRequest) returns (DeleteCustomerResponse);
  // List all customers with optional filtering
  rpc ListCustomers (ListCustomersRequest) returns (CustomerListResponse);
  // Search customers by name or email
  rpc SearchCustomers (SearchCustomersRequest) returns (CustomerListResponse);
}

// Messages for Customer entity
message Customer {
  string id = 1;
  string first_name = 2;
  string last_name = 3;
  string email = 4;
  string phone = 5;
  string address = 6;
  string created_at = 7;
  string updated_at = 8;
}

message CreateCustomerRequest {
  string first_name = 1;
  string last_name = 2;
  string email = 3;
  string phone = 4;
  string address = 5;
}

message GetCustomerRequest {
  string id = 1;
}

message UpdateCustomerRequest {
  string id = 1;
  string first_name = 2;
  string last_name = 3;
  string email = 4;
  string phone = 5;
  string address = 6;
}

message DeleteCustomerRequest {
  string id = 1;
}

message DeleteCustomerResponse {
  bool success = 1;
  string message = 2;
}

message ListCustomersRequest {
  int32 page = 1;
  int32 limit = 2;
}

message SearchCustomersRequest {
  string query = 1;
}

message CustomerResponse {
  Customer customer = 1;
}

message CustomerListResponse {
  repeated Customer customers = 1;
  int32 total = 2;
}
